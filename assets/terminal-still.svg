<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title"><title id="title">Sultan Kassam: AI interfaces and operational software. Explore, implement, inspect.</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#303D4E" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#39D0FF" stop-opacity=".24"/><stop offset="1" stop-color="#39D0FF" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#A371F7" stop-opacity=".12"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1C2531" stop-opacity=".6"/><stop offset="1" stop-color="#161B22" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="958" height="258" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}*{animation:none!important}.calendar-veil{display:none!important}</style>
<rect class="outer" x=".5" y=".5" width="959" height="259" rx="18" fill="#0D1117" stroke="#303D4E"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#F0F6FC"><rect x="1" y="1" width="958" height="46" fill="#161B22"/><circle cx="24" cy="23" r="4" fill="#303D4E"/><circle cx="40" cy="23" r="4" fill="#303D4E"/><circle cx="56" cy="23" r="4" fill="#303D4E"/><text x="110" y="28" font-size="12" fill="#A0AEBD" class="mono">sultan@github / session</text><text x="24" y="82" font-size="18" fill="#39D0FF" class="mono">$ whoami</text><text x="24" y="116" font-size="30" fill="#F0F6FC" font-weight="700" letter-spacing="-1">Sultan Kassam</text><text x="24" y="149" font-size="21" fill="#A0AEBD" >AI interfaces + operational software</text><text x="24" y="194" font-size="18" fill="#39D0FF" class="mono">$ build --from idea --to system</text><text x="24" y="229" font-size="24" fill="#F0F6FC" font-weight="700" letter-spacing="-1">Explore. Implement. Inspect.</text><rect x="337" y="214" width="9" height="20" fill="#39D0FF" class="cursor"/></g></svg>
