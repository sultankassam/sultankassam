<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title"><title id="title">Conceptual map of conversational and operational software domains</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30363D" stroke-opacity=".25"/></pattern><radialGradient id="glow"><stop stop-color="#39D0FF" stop-opacity=".14"/><stop offset="1" stop-color="#0D1117" stop-opacity="0"/></radialGradient></defs><rect x=".5" y=".5" width="959" height="259" rx="16" fill="#0D1117" stroke="#30363D"/><g font-family="Segoe UI,Arial,sans-serif" fill="#F0F6FC"><text x="32" y="38" font-size="13" fill="#A0ACBA" >SYSTEM MAP / TWO DIRECTIONS, ONE ENGINEERING PRACTICE</text><path d="M270 130H385M575 130H690" stroke="#39D0FF" stroke-opacity=".6"/><rect x="32" y="75" width="250" height="132" rx="12" fill="#161B22" stroke="#30363D"/><text x="52" y="109" font-size="15" fill="#39D0FF" >CONVERSATIONAL</text><text x="52" y="147" font-size="17"  >Voice / chat interfaces</text><text x="52" y="179" font-size="15" fill="#A0ACBA" >Next.js + OpenAI</text><rect x="355" y="75" width="250" height="132" rx="12" fill="#161B22" stroke="#30363D"/><text x="375" y="109" font-size="15" fill="#39D0FF" >PRODUCT SYSTEMS</text><text x="375" y="147" font-size="17"  >State / roles / workflows</text><text x="375" y="179" font-size="15" fill="#A0ACBA" >Software architecture</text><rect x="678" y="75" width="250" height="132" rx="12" fill="#161B22" stroke="#30363D"/><text x="698" y="109" font-size="15" fill="#39D0FF" >OPERATIONAL</text><text x="698" y="147" font-size="17"  >Bookings / inventory</text><text x="698" y="179" font-size="15" fill="#A0ACBA" >Django + Python</text><text x="32" y="239" font-size="13" fill="#A0ACBA" >Conceptual domain map; project implementations remain separate.</text></g></svg>
