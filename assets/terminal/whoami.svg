<svg xmlns="http://www.w3.org/2000/svg" width="960" height="304" viewBox="0 0 960 304" role="img" aria-labelledby="title"><title id="title">Sultan Kassam: AI interfaces, software and connected workflows. Build is an editorial mode.</title><defs>
