<svg xmlns="http://www.w3.org/2000/svg" width="960" height="274" viewBox="0 0 960 274" role="img" aria-labelledby="title"><title id="title">JARVIS: A voice-enabled conversational interface. Public prototype, TypeScript / Next.js / React / OpenAI.</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#303D4E" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#39D0FF" stop-opacity=".24"/><stop offset="1" stop-color="#39D0FF" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#A371F7" stop-opacity=".12"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1C2531" stop-opacity=".6"/><stop offset="1" stop-color="#161B22" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="958" height="272" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}</style>
