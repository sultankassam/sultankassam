<svg xmlns="http://www.w3.org/2000/svg" width="400" height="348" viewBox="0 0 400 348" role="img" aria-labelledby="title"><title id="title">JARVIS: A voice-enabled conversational interface. Public prototype, TypeScript / Next.js / React / OpenAI.</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#303D4E" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#39D0FF" stop-opacity=".24"/><stop offset="1" stop-color="#39D0FF" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#A371F7" stop-opacity=".12"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1C2531" stop-opacity=".6"/><stop offset="1" stop-color="#161B22" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="398" height="346" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}.pulse,.cursor,.scan{animation:none!important}</style>
<rect class="outer" x=".5" y=".5" width="399" height="347" rx="18" fill="#0D1117" stroke="#303D4E"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#F0F6FC"><rect width="400" height="348" fill="url(#grid)"/><ellipse cx="374" cy="70" rx="185" ry="185" fill="url(#glow)"/><text x="24" y="34" font-size="12" fill="#A0AEBD" class="mono">01A / AI INTERFACE / PROTOTYPE</text><text x="22" y="93" font-size="48" fill="#F0F6FC" font-weight="700" letter-spacing="-1">JARVIS</text><text x="24" y="132" font-size="20"  >Voice. Conversation. Context.</text><g transform="translate(44 153)"><path d="M0 55h18l6-16 7 32 7-46 7 58 7-41 7 20 8-7h16" fill="none" stroke="#39D0FF" stroke-width="2"/><path d="M86 55H110M190 55H212" stroke="#303D4E"/><rect x="110" y="16" width="80" height="80" rx="12" fill="url(#panel)" stroke="#303D4E"/><text x="128" y="64" font-size="26" fill="#39D0FF" font-weight="700" letter-spacing="-1">AI</text><rect x="214" y="27" width="82" height="56" rx="12" fill="url(#panel)" stroke="#303D4E"/><path d="M230 44h42M230 55h32M230 66h37" stroke="#39D0FF" stroke-opacity=".6"/><text x="0" y="125" font-size="12" fill="#A0AEBD" class="mono">VOICE</text><text x="112" y="125" font-size="12" fill="#A0AEBD" class="mono">MODEL</text><text x="214" y="125" font-size="12" fill="#A0AEBD" class="mono">REPLY</text><circle cx="97" cy="55" r="3" fill="#39D0FF" class="pulse"/></g><path d="M24 291L376 291" fill="none" stroke="#303D4E"/><text x="24" y="316" font-size="17" fill="#A0AEBD" class="mono">Next.js / React / OpenAI</text><text x="24" y="337" font-size="13" fill="#39D0FF" class="mono">OPEN SOURCE →</text></g></svg>
