<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title"><title id="title">Engineering projects excluding profile and art: recent push dates, project count and primary language by source bytes. Snapshot, not presence.</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#303D4E" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#39D0FF" stop-opacity=".24"/><stop offset="1" stop-color="#39D0FF" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#A371F7" stop-opacity=".12"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1C2531" stop-opacity=".6"/><stop offset="1" stop-color="#161B22" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="958" height="338" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}</style>
<rect class="outer" x=".5" y=".5" width="959" height="339" rx="18" fill="#0D1117" stroke="#303D4E"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#F0F6FC"><text x="24" y="34" font-size="13" fill="#A0AEBD" class="mono">CURRENT SIGNAL / ENGINEERING</text><text x="24" y="85" font-size="42" fill="#F0F6FC" font-weight="700" letter-spacing="-1">02</text><text x="105" y="82" font-size="13" fill="#A0AEBD" class="mono">PUBLIC PROJECTS</text><text x="515" y="85" font-size="34" fill="#39D0FF" font-weight="700" letter-spacing="-1">Python</text><text x="690" y="82" font-size="12" fill="#A0AEBD" class="mono">PRIMARY LANGUAGE</text><path d="M24 122L936 122" fill="none" stroke="#303D4E"/><text x="24" y="151" font-size="25" fill="#F0F6FC" font-weight="700" letter-spacing="-1">JARVIS</text><text x="300" y="151" font-size="13" fill="#A0AEBD" class="mono">PUSH ≤ 7D / 2026-10-06</text><path d="M24 181L936 181" fill="none" stroke="#303D4E"/><text x="24" y="210" font-size="25" fill="#F0F6FC" font-weight="700" letter-spacing="-1">AUTOMOD</text><text x="300" y="210" font-size="13" fill="#A0AEBD" class="mono">PUSH ≤ 7D / 2026-10-06</text><text x="24" y="267" font-size="12" fill="#A0AEBD" class="mono">SNAPSHOT / 2026-10-07 UTC</text><text x="24" y="291" font-size="12" fill="#A0AEBD" class="mono">Nairobi generation zone / UTC+3</text><text x="24" y="317" font-size="16" fill="#A0AEBD" >Push dates show activity, not live presence.</text></g></svg>
