<svg xmlns="http://www.w3.org/2000/svg" width="400" height="502" viewBox="0 0 400 502" role="img" aria-labelledby="title"><title id="title">Engineering instruments: verified languages, interface tools, OpenAI integration and Django workflows</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#303D4E" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#39D0FF" stop-opacity=".24"/><stop offset="1" stop-color="#39D0FF" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#A371F7" stop-opacity=".12"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1C2531" stop-opacity=".6"/><stop offset="1" stop-color="#161B22" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="398" height="500" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}</style>
<rect class="outer" x=".5" y=".5" width="399" height="501" rx="18" fill="#0D1117" stroke="#303D4E"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#F0F6FC"><text x="24" y="34" font-size="12" fill="#A0AEBD" class="mono">05 // VERIFIED STACK</text><rect x="20" y="52" width="360" height="88" rx="12" fill="url(#panel)" stroke="#303D4E"/><text x="34" y="76" font-size="13" fill="#39D0FF" class="mono">01 / LANGUAGE CORE</text><text x="34" y="102" font-size="20" fill="#F0F6FC" font-weight="700" letter-spacing="-1">TypeScript</text><text x="34" y="126" font-size="15" fill="#A0AEBD" >Python · JavaScript / HTML / CSS</text><rect x="20" y="154" width="360" height="88" rx="12" fill="url(#panel)" stroke="#303D4E"/><text x="34" y="178" font-size="13" fill="#39D0FF" class="mono">02 / INTERFACE</text><text x="34" y="204" font-size="20" fill="#F0F6FC" font-weight="700" letter-spacing="-1">React / Next.js</text><text x="34" y="228" font-size="15" fill="#A0AEBD" >Browser speech · Client-side state</text><rect x="20" y="256" width="360" height="88" rx="12" fill="url(#panel)" stroke="#303D4E"/><text x="34" y="280" font-size="13" fill="#39D0FF" class="mono">03 / INTELLIGENCE</text><text x="34" y="306" font-size="20" fill="#F0F6FC" font-weight="700" letter-spacing="-1">OpenAI API</text><text x="34" y="330" font-size="15" fill="#A0AEBD" >Chat / file analysis · Jarvis integration</text><rect x="20" y="358" width="360" height="88" rx="12" fill="url(#panel)" stroke="#303D4E"/><text x="34" y="382" font-size="13" fill="#39D0FF" class="mono">04 / WORKFLOWS</text><text x="34" y="408" font-size="20" fill="#F0F6FC" font-weight="700" letter-spacing="-1">Django / ORM</text><text x="34" y="432" font-size="14" fill="#A0AEBD" >Bookings / inventory · AutoMod application</text><text x="24" y="481" font-size="12" fill="#A0AEBD" class="mono">Observed in public source. No skill ratings.</text></g></svg>
