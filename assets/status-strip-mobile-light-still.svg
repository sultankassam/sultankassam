<svg xmlns="http://www.w3.org/2000/svg" width="400" height="102" viewBox="0 0 400 102" role="img" aria-labelledby="title"><title id="title">Public lab: 2 original public projects. Snapshot collected on 2026-10-10 UTC; not service uptime.</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C9D5E4" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#006C9E" stop-opacity=".24"/><stop offset="1" stop-color="#006C9E" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#7545C0" stop-opacity=".12"/><stop offset="1" stop-color="#7545C0" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#EAF0F8" stop-opacity=".6"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="398" height="100" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}*{animation:none!important}.calendar-veil{display:none!important}</style>
<rect class="outer" x=".5" y=".5" width="399" height="101" rx="18" fill="#F6F8FC" stroke="#C9D5E4"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#101E30"><circle cx="24" cy="29" r="8" fill="#16723F" opacity=".12" class="pulse"/><circle cx="24" cy="29" r="4" fill="#16723F"/><text x="39" y="34" font-size="13" fill="#16723F" class="mono">PUBLIC LAB</text><text x="230" y="34" font-size="13" fill="#50647D" class="mono">02 PROJECTS</text><text x="24" y="66" font-size="13" fill="#50647D" class="mono">SYNC / 2026-10-10 UTC</text><text x="24" y="88" font-size="11" fill="#50647D" class="mono">DAILY PUBLIC API SNAPSHOT</text></g></svg>
