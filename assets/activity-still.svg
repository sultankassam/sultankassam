<svg xmlns="http://www.w3.org/2000/svg" width="960" height="255" viewBox="0 0 960 255" role="img" aria-labelledby="title"><title id="title">28-day UTC public event trace from GitHub. Bounded feed, not commit or contribution totals. Scan and pulse are decorative.</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#303D4E" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#39D0FF" stop-opacity=".24"/><stop offset="1" stop-color="#39D0FF" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#A371F7" stop-opacity=".12"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1C2531" stop-opacity=".6"/><stop offset="1" stop-color="#161B22" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="958" height="253" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}*{animation:none!important}.calendar-veil{display:none!important}</style>
<rect class="outer" x=".5" y=".5" width="959" height="254" rx="18" fill="#0D1117" stroke="#303D4E"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#F0F6FC"><rect width="960" height="255" fill="url(#grid)"/><text x="32" y="35" font-size="13" fill="#A0AEBD" class="mono">PUBLIC ACTIVITY / 28D / EVENT TRACE</text><text x="32" y="56" font-size="12" fill="#A0AEBD" class="mono">10 returned events / peak 6 per day</text><path d="M32 72H928" stroke="#303D4E" stroke-opacity=".5" stroke-dasharray="2 6"/><path d="M32 116.5H928" stroke="#303D4E" stroke-opacity=".5" stroke-dasharray="2 6"/><path d="M32 161H928" stroke="#303D4E" stroke-opacity=".5" stroke-dasharray="2 6"/><path d="M32.00 161.00 L65.19 161.00 L98.37 161.00 L131.56 161.00 L164.74 161.00 L197.93 161.00 L231.11 161.00 L264.30 161.00 L297.48 161.00 L330.67 161.00 L363.85 161.00 L397.04 161.00 L430.22 161.00 L463.41 161.00 L496.59 161.00 L529.78 161.00 L562.96 161.00 L596.15 161.00 L629.33 161.00 L662.52 161.00 L695.70 161.00 L728.89 161.00 L762.07 161.00 L795.26 161.00 L828.44 72.00 L861.63 101.67 L894.81 161.00 L928.00 161.00L928 161H32Z" fill="#39D0FF" fill-opacity=".08"/><path d="M32.00 161.00 L65.19 161.00 L98.37 161.00 L131.56 161.00 L164.74 161.00 L197.93 161.00 L231.11 161.00 L264.30 161.00 L297.48 161.00 L330.67 161.00 L363.85 161.00 L397.04 161.00 L430.22 161.00 L463.41 161.00 L496.59 161.00 L529.78 161.00 L562.96 161.00 L596.15 161.00 L629.33 161.00 L662.52 161.00 L695.70 161.00 L728.89 161.00 L762.07 161.00 L795.26 161.00 L828.44 72.00 L861.63 101.67 L894.81 161.00 L928.00 161.00" fill="none" stroke="#39D0FF" stroke-width="2.5" stroke-linejoin="round"/><circle cx="928" cy="161" r="3" fill="#39D0FF" class="pulse"/><path d="M614.4 67V166" stroke="#39D0FF" stroke-opacity=".25" class="scan"/><text x="32" y="192" font-size="12" fill="#A0AEBD" class="mono">2026-09-11</text><text x="824" y="192" font-size="12" fill="#A0AEBD" class="mono">2026-10-08</text><text x="32" y="223" font-size="12" fill="#A0AEBD" class="mono">SOURCE / GITHUB PUBLIC EVENTS / 28-DAY UTC WINDOW</text><text x="32" y="244" font-size="13" fill="#A0AEBD" >Bounded event feed. Not commits, annual contributions or service telemetry.</text></g></svg>
