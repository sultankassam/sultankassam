<radialGradient id="glow"><stop stop-color="#39D0FF" stop-opacity=".24"/><stop offset="1" stop-color="#39D0FF" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#A371F7" stop-opacity=".12"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1C2531" stop-opacity=".6"/><stop offset="1" stop-color="#161B22" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="958" height="476" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}</style>
<rect class="outer" x=".5" y=".5" width="959" height="477" rx="18" fill="#0D1117" stroke="#303D4E"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#F0F6FC"><g class="boot"><rect width="960" height="478" fill="url(#grid)"/><ellipse cx="778" cy="226" rx="345" ry="345" fill="url(#glow)"/><ellipse cx="580" cy="475" rx="260" ry="190" fill="url(#violet)"/><g transform="translate(39 25) scale(0.59375)" fill="none" stroke="#39D0FF" stroke-width="5" stroke-linecap="square"><path d="M27 12H9v19h18v21H9M38 12v40M56 12L38 32l18 20"/></g><text x="97" y="51" font-size="14" fill="#A0AEBD" class="mono">SK // SULTAN OS / PROFILE.3</text><text x="699" y="51" font-size="13" fill="#A0AEBD" class="mono">00 // BOOT / SK-2026</text><text x="35" y="180" font-size="114" fill="#F0F6FC" font-weight="750" letter-spacing="-3">SULTAN</text><text x="35" y="287" font-size="114" fill="#F0F6FC" font-weight="750" letter-spacing="-3">KASSAM</text><g transform="translate(779 217)" fill="none"><circle r="111" stroke="#39D0FF" stroke-opacity=".13"/><circle r="91.02" stroke="#39D0FF" stroke-opacity=".38" stroke-dasharray="1 7"/><circle r="66.6" stroke="#303D4E"/><path d="M-111 0H-77.69999999999999M77.69999999999999 0H111M0 -111V-77.69999999999999M0 77.69999999999999V111" stroke="#39D0FF" stroke-opacity=".5"/><path d="M-82.14 -46.62A94.35 94.35 0 0 1 11.100000000000001 -93.24" stroke="#39D0FF" stroke-width="2"/><path d="M82.14 46.62A94.35 94.35 0 0 1 -11.100000000000001 93.24" stroke="#A371F7" stroke-opacity=".6"/><circle cx="91.02" cy="0" r="4" fill="#39D0FF" class="pulse"/></g><g transform="translate(747.92 185.92) scale(0.9712500000000001)" fill="none" stroke="#39D0FF" stroke-width="5" stroke-linecap="square"><path d="M27 12H9v19h18v21H9M38 12v40M56 12L38 32l18 20"/></g><text x="685" y="365" font-size="12" fill="#A0AEBD" class="mono">INTERFACE / INTELLIGENCE</text><text x="42" y="347" font-size="28" fill="#F0F6FC" font-weight="700" letter-spacing="-1">THINK IN SYSTEMS.</text><text x="42" y="382" font-size="28" fill="#39D0FF" font-weight="700" letter-spacing="-1">BUILD IN CODE.</text><path d="M40 416L920 416" fill="none" stroke="#303D4E"/><text x="42" y="451" font-size="14" fill="#A0AEBD" class="mono">AI INTERFACES / SOFTWARE / CONNECTED WORKFLOWS</text><path d="M780 447h20l6-6 7 12 7-12 6 6h48" fill="none" stroke="#39D0FF" stroke-opacity=".8"/></g><g class="ready"><circle cx="710" cy="94" r="8" fill="#56D58B" opacity=".12" class="pulse"/><circle cx="710" cy="94" r="4" fill="#56D58B"/><text x="724" y="99" font-size="11" fill="#56D58B" class="mono">READY</text></g><style>.ready{animation:bootIn .3s ease 1.5s both}.boot > g{animation:bootIn .35s ease .2s both}.boot > rect{animation:bootIn .5s ease .5s both}.boot > text{animation:bootIn .5s ease 1.1s both}.boot > text[font-size="114"],.boot > text[font-size="65"]{animation-delay:.8s}@keyframes bootIn{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.boot > *,.ready{animation:none}}</style></g></svg>
