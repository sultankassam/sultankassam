<svg xmlns="http://www.w3.org/2000/svg" width="400" height="322" viewBox="0 0 400 322" role="img" aria-labelledby="title"><title id="title">Conceptual topology: Jarvis voice and intelligence; AutoMod operational workflows. Separate implementations.</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C9D5E4" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#006C9E" stop-opacity=".24"/><stop offset="1" stop-color="#006C9E" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#7545C0" stop-opacity=".12"/><stop offset="1" stop-color="#7545C0" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#EAF0F8" stop-opacity=".6"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="398" height="320" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}</style>
<rect class="outer" x=".5" y=".5" width="399" height="321" rx="18" fill="#F6F8FC" stroke="#C9D5E4"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#101E30"><rect width="400" height="322" fill="url(#grid)"/><text x="24" y="34" font-size="12" fill="#50647D" class="mono">02 / PUBLIC SYSTEM TOPOLOGY</text><path d="M200 60V90M106 169v22h188v-22M200 191v25" fill="none" stroke="#006C9E" stroke-opacity=".55"/><rect x="90" y="51" width="220" height="38" rx="12" fill="url(#panel)" stroke="#C9D5E4"/><text x="123" y="76" font-size="15" fill="#006C9E" class="mono">SULTAN / SYSTEMS</text><rect x="20" y="105" width="172" height="67" rx="12" fill="url(#panel)" stroke="#C9D5E4"/><text x="37" y="130" font-size="20" fill="#101E30" font-weight="700" letter-spacing="-1">JARVIS</text><text x="37" y="155" font-size="15" fill="#50647D" >Voice + intelligence</text><rect x="208" y="105" width="172" height="67" rx="12" fill="url(#panel)" stroke="#C9D5E4"/><text x="225" y="130" font-size="20" fill="#101E30" font-weight="700" letter-spacing="-1">AUTOMOD</text><text x="225" y="155" font-size="15" fill="#50647D" >Operations + roles</text><rect x="65" y="217" width="270" height="55" rx="12" fill="url(#panel)" stroke="#C9D5E4"/><text x="95" y="250" font-size="17" fill="#006C9E" >INTERFACES ↔ WORKFLOWS</text><text x="24" y="301" font-size="12" fill="#50647D" class="mono">Conceptual map / separate implementations</text></g></svg>
