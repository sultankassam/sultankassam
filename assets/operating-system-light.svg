<svg xmlns="http://www.w3.org/2000/svg" width="960" height="139" viewBox="0 0 960 139" role="img" aria-labelledby="title"><title id="title">Personal approach: ideas and practical problems, interfaces and workflows, inspectable public prototypes</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C9D5E4" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#006C9E" stop-opacity=".24"/><stop offset="1" stop-color="#006C9E" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#7545C0" stop-opacity=".12"/><stop offset="1" stop-color="#7545C0" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#EAF0F8" stop-opacity=".6"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="958" height="137" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}</style>
<rect class="outer" x=".5" y=".5" width="959" height="138" rx="18" fill="#F6F8FC" stroke="#C9D5E4"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#101E30"><text x="32" y="34" font-size="12" fill="#50647D" class="mono">SULTAN / ENGINEERING OS</text><text x="32" y="78" font-size="13" fill="#006C9E" class="mono">INPUT</text><text x="32" y="112" font-size="23" fill="#101E30" font-weight="700" letter-spacing="-1">Ideas + problems</text><text x="342" y="78" font-size="13" fill="#006C9E" class="mono">PROCESS</text><text x="342" y="112" font-size="23" fill="#101E30" font-weight="700" letter-spacing="-1">AI interfaces + workflows</text><text x="652" y="78" font-size="13" fill="#006C9E" class="mono">OUTPUT</text><text x="652" y="112" font-size="23" fill="#101E30" font-weight="700" letter-spacing="-1">Public prototypes</text><path d="M257 88h41m-5-4 5 4-5 4M599 88h35m-5-4 5 4-5 4" fill="none" stroke="#C9D5E4"/></g></svg>
