<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title"><title id="title">Conceptual map of conversational and operational software domains</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D0D7DE" stroke-opacity=".25"/></pattern><radialGradient id="glow"><stop stop-color="#0969A6" stop-opacity=".14"/><stop offset="1" stop-color="#F6F8FA" stop-opacity="0"/></radialGradient></defs><rect x=".5" y=".5" width="959" height="259" rx="16" fill="#F6F8FA" stroke="#D0D7DE"/><g font-family="Segoe UI,Arial,sans-serif" fill="#182230"><text x="32" y="38" font-size="13" fill="#536174" >SYSTEM MAP / TWO DIRECTIONS, ONE ENGINEERING PRACTICE</text><path d="M270 130H385M575 130H690" stroke="#0969A6" stroke-opacity=".6"/><rect x="32" y="75" width="250" height="132" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/><text x="52" y="109" font-size="15" fill="#0969A6" >CONVERSATIONAL</text><text x="52" y="147" font-size="17"  >Voice / chat interfaces</text><text x="52" y="179" font-size="15" fill="#536174" >Next.js + OpenAI</text><rect x="355" y="75" width="250" height="132" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/><text x="375" y="109" font-size="15" fill="#0969A6" >PRODUCT SYSTEMS</text><text x="375" y="147" font-size="17"  >State / roles / workflows</text><text x="375" y="179" font-size="15" fill="#536174" >Software architecture</text><rect x="678" y="75" width="250" height="132" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/><text x="698" y="109" font-size="15" fill="#0969A6" >OPERATIONAL</text><text x="698" y="147" font-size="17"  >Bookings / inventory</text><text x="698" y="179" font-size="15" fill="#536174" >Django + Python</text><text x="32" y="239" font-size="13" fill="#536174" >Conceptual domain map; project implementations remain separate.</text></g></svg>
