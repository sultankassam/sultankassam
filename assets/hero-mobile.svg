<svg xmlns="http://www.w3.org/2000/svg" width="400" height="438" viewBox="0 0 400 438" role="img" aria-labelledby="title"><title id="title">Sultan Kassam — think in systems, build in code</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#303D4E" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#39D0FF" stop-opacity=".24"/><stop offset="1" stop-color="#39D0FF" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#A371F7" stop-opacity=".12"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1C2531" stop-opacity=".6"/><stop offset="1" stop-color="#161B22" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="398" height="436" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}</style>
<rect class="outer" x=".5" y=".5" width="399" height="437" rx="18" fill="#0D1117" stroke="#303D4E"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#F0F6FC"><rect width="400" height="438" fill="url(#grid)"/><ellipse cx="360" cy="270" rx="220" ry="220" fill="url(#glow)"/><g transform="translate(27 23) scale(0.53125)" fill="none" stroke="#39D0FF" stroke-width="5" stroke-linecap="square"><path d="M27 12H9v19h18v21H9M38 12v40M56 12L38 32l18 20"/></g><text x="78" y="46" font-size="12" fill="#A0AEBD" class="mono">SK / PERSONAL SYSTEMS</text><text x="24" y="133" font-size="65" fill="#F0F6FC" font-weight="750" letter-spacing="-3">SULTAN</text><text x="24" y="200" font-size="65" fill="#F0F6FC" font-weight="750" letter-spacing="-3">KASSAM</text><path d="M26 227H372" stroke="#39D0FF" stroke-opacity=".6"/><text x="26" y="270" font-size="25" fill="#F0F6FC" font-weight="700" letter-spacing="-1">THINK IN SYSTEMS.</text><text x="26" y="301" font-size="25" fill="#39D0FF" font-weight="700" letter-spacing="-1">BUILD IN CODE.</text><text x="26" y="342" font-size="13" fill="#A0AEBD" class="mono">AI INTERFACES / SOFTWARE</text><text x="26" y="366" font-size="13" fill="#A0AEBD" class="mono">CONNECTED WORKFLOWS</text><path d="M26 390L374 390" fill="none" stroke="#303D4E"/><text x="26" y="418" font-size="12" fill="#A0AEBD" class="mono">sultankassam / PUBLIC LAB</text></g></svg>
