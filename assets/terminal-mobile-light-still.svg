<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="title"><title id="title">Sultan Kassam: AI interfaces and operational software. Explore, implement, inspect.</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C9D5E4" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#006C9E" stop-opacity=".24"/><stop offset="1" stop-color="#006C9E" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#7545C0" stop-opacity=".12"/><stop offset="1" stop-color="#7545C0" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#EAF0F8" stop-opacity=".6"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="398" height="258" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}.pulse,.cursor,.scan{animation:none!important}</style>
<rect class="outer" x=".5" y=".5" width="399" height="259" rx="18" fill="#F6F8FC" stroke="#C9D5E4"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#101E30"><rect x="1" y="1" width="398" height="46" fill="#FFFFFF"/><circle cx="24" cy="23" r="4" fill="#C9D5E4"/><circle cx="40" cy="23" r="4" fill="#C9D5E4"/><circle cx="56" cy="23" r="4" fill="#C9D5E4"/><text x="94" y="28" font-size="12" fill="#50647D" class="mono">sultan@github / session</text><text x="24" y="82" font-size="17" fill="#006C9E" class="mono">$ whoami</text><text x="24" y="116" font-size="24" fill="#101E30" font-weight="700" letter-spacing="-1">Sultan Kassam</text><text x="24" y="149" font-size="17" fill="#50647D" >AI interfaces + operational software</text><text x="24" y="194" font-size="14" fill="#006C9E" class="mono">$ build --from idea --to system</text><text x="24" y="229" font-size="20" fill="#101E30" font-weight="700" letter-spacing="-1">Explore. Implement. Inspect.</text><rect x="292" y="214" width="9" height="20" fill="#006C9E" class="cursor"/></g></svg>
