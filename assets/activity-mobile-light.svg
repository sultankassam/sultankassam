<svg xmlns="http://www.w3.org/2000/svg" width="400" height="255" viewBox="0 0 400 255" role="img" aria-labelledby="title"><title id="title">28-day UTC public event trace from GitHub. Bounded feed, not commit or contribution totals. Scan and pulse are decorative.</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C9D5E4" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#006C9E" stop-opacity=".24"/><stop offset="1" stop-color="#006C9E" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#7545C0" stop-opacity=".12"/><stop offset="1" stop-color="#7545C0" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#EAF0F8" stop-opacity=".6"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="398" height="253" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}</style>
<rect class="outer" x=".5" y=".5" width="399" height="254" rx="18" fill="#F6F8FC" stroke="#C9D5E4"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#101E30"><rect width="400" height="255" fill="url(#grid)"/><text x="24" y="35" font-size="12" fill="#50647D" class="mono">PUBLIC ACTIVITY / 28D</text><text x="24" y="56" font-size="11" fill="#50647D" class="mono">10 returned events / peak 6 per day</text><path d="M24 71H376" stroke="#C9D5E4" stroke-opacity=".5" stroke-dasharray="2 6"/><path d="M24 106.5H376" stroke="#C9D5E4" stroke-opacity=".5" stroke-dasharray="2 6"/><path d="M24 142H376" stroke="#C9D5E4" stroke-opacity=".5" stroke-dasharray="2 6"/><path d="M24.00 142.00 L37.04 142.00 L50.07 142.00 L63.11 142.00 L76.15 142.00 L89.19 142.00 L102.22 142.00 L115.26 142.00 L128.30 142.00 L141.33 142.00 L154.37 142.00 L167.41 142.00 L180.44 142.00 L193.48 142.00 L206.52 142.00 L219.56 142.00 L232.59 142.00 L245.63 142.00 L258.67 142.00 L271.70 142.00 L284.74 142.00 L297.78 142.00 L310.81 71.00 L323.85 94.67 L336.89 142.00 L349.93 142.00 L362.96 142.00 L376.00 142.00L376 142H24Z" fill="#006C9E" fill-opacity=".08"/><path d="M24.00 142.00 L37.04 142.00 L50.07 142.00 L63.11 142.00 L76.15 142.00 L89.19 142.00 L102.22 142.00 L115.26 142.00 L128.30 142.00 L141.33 142.00 L154.37 142.00 L167.41 142.00 L180.44 142.00 L193.48 142.00 L206.52 142.00 L219.56 142.00 L232.59 142.00 L245.63 142.00 L258.67 142.00 L271.70 142.00 L284.74 142.00 L297.78 142.00 L310.81 71.00 L323.85 94.67 L336.89 142.00 L349.93 142.00 L362.96 142.00 L376.00 142.00" fill="none" stroke="#006C9E" stroke-width="2.5" stroke-linejoin="round"/><circle cx="376" cy="142" r="3" fill="#006C9E" class="pulse"/><path d="M252.8 66V147" stroke="#006C9E" stroke-opacity=".25" class="scan"/><text x="24" y="172" font-size="12" fill="#50647D" class="mono">2026-09-13</text><text x="278" y="172" font-size="12" fill="#50647D" class="mono">2026-10-10</text><text x="24" y="203" font-size="11" fill="#50647D" class="mono">GITHUB PUBLIC EVENTS / UTC</text><text x="24" y="233" font-size="14" fill="#50647D" >Bounded feed. Not contribution totals.</text></g></svg>
