<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 0 960 266" role="img" aria-labelledby="title"><title id="title">Engineering instruments: verified languages, interface tools, OpenAI integration and Django workflows</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C9D5E4" stroke-opacity=".32" stroke-width=".6"/></pattern>
<radialGradient id="glow"><stop stop-color="#006C9E" stop-opacity=".24"/><stop offset="1" stop-color="#006C9E" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#7545C0" stop-opacity=".12"/><stop offset="1" stop-color="#7545C0" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#EAF0F8" stop-opacity=".6"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="958" height="264" rx="18"/></clipPath></defs>
<style>.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}.scan{animation:scan 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(42px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}}</style>
<rect class="outer" x=".5" y=".5" width="959" height="265" rx="18" fill="#F6F8FC" stroke="#C9D5E4"/><g clip-path="url(#frame)" font-family="Segoe UI,Arial,sans-serif" fill="#101E30"><text x="32" y="37" font-size="13" fill="#50647D" class="mono">03 / ENGINEERING INSTRUMENTS</text><rect x="24" y="59" width="210" height="157" rx="12" fill="url(#panel)" stroke="#C9D5E4"/><rect x="39" y="77" width="3" height="16" fill="#006C9E"/><text x="51" y="90" font-size="11" fill="#50647D" class="mono">01 / LANGUAGE CORE</text><text x="40" y="130" font-size="23" fill="#101E30" font-weight="700" letter-spacing="-1">TypeScript</text><text x="40" y="163" font-size="17" fill="#50647D" >Python</text><text x="40" y="192" font-size="14" fill="#50647D" >JavaScript / HTML / CSS</text><rect x="258" y="59" width="210" height="157" rx="12" fill="url(#panel)" stroke="#C9D5E4"/><rect x="273" y="77" width="3" height="16" fill="#006C9E"/><text x="285" y="90" font-size="11" fill="#50647D" class="mono">02 / INTERFACE</text><text x="274" y="130" font-size="23" fill="#101E30" font-weight="700" letter-spacing="-1">React / Next.js</text><text x="274" y="163" font-size="17" fill="#50647D" >Browser speech</text><text x="274" y="192" font-size="14" fill="#50647D" >Client-side state</text><rect x="492" y="59" width="210" height="157" rx="12" fill="url(#panel)" stroke="#C9D5E4"/><rect x="507" y="77" width="3" height="16" fill="#7545C0"/><text x="519" y="90" font-size="11" fill="#50647D" class="mono">03 / INTELLIGENCE</text><text x="508" y="130" font-size="23" fill="#101E30" font-weight="700" letter-spacing="-1">OpenAI API</text><text x="508" y="163" font-size="17" fill="#50647D" >Chat / file analysis</text><text x="508" y="192" font-size="14" fill="#50647D" >Jarvis integration</text><rect x="726" y="59" width="210" height="157" rx="12" fill="url(#panel)" stroke="#C9D5E4"/><rect x="741" y="77" width="3" height="16" fill="#006C9E"/><text x="753" y="90" font-size="11" fill="#50647D" class="mono">04 / WORKFLOWS</text><text x="742" y="130" font-size="23" fill="#101E30" font-weight="700" letter-spacing="-1">Django / ORM</text><text x="742" y="163" font-size="17" fill="#50647D" >Bookings / inventory</text><text x="742" y="192" font-size="14" fill="#50647D" >AutoMod application</text><text x="32" y="244" font-size="12" fill="#50647D" class="mono">OBSERVED IN PUBLIC SOURCE / IMPLEMENTATION MAP, NOT PROFICIENCY</text></g></svg>
